# DIAL-MPC: Hessian-based
seed: 0
output_dir: unitree_go2_trot_hessian_test
n_steps: 400

env_name: unitree_go2_walk
Nsample: 1024  # Numero di campioni drasticamente ridotto
Hsample: 16
Hnode: 4
Ndiffuse: 2
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5

dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0

default_vx: 0.8
default_vy: 0.0
default_vyaw: 0.0
ramp_up_time: 1.0
gait: trot 